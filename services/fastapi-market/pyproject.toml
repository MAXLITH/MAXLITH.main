[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maxlith-fastapi-market"
version = "2.0.0"
description = "MAXLITH V2 High-Performance FastAPI Market Data Feed V3 Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "protobuf>=5.27.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "grpcio-tools>=1.66.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]

